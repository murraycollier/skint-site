baseURL = "https://skint.site/"
locale = "en-GB"
title = "Skint"
disableKinds = ["taxonomy", "term", "RSS"]

[markup.goldmark.renderer]
  unsafe = false

[params]
  tagline = "Your household money, on one calm screen."
  description = "Skint is a free, self-hosted household money tracker. See take-home pay, bills and what's left at the end of the month, on your own server."
  # Buy Me a Coffee page
  coffeeUrl = "https://buymeacoffee.com/murraycollier"
  # The public Skint repo holds the downloads and the issue tracker.
  repoUrl = "https://github.com/murraycollier/skint"
  releaseUrl = "https://github.com/murraycollier/skint/releases/latest/download"
  issuesUrl = "https://github.com/murraycollier/skint/issues"
  newIssueUrl = "https://github.com/murraycollier/skint/issues/new/choose"
