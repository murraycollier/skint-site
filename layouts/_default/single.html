{{ define "main" }}
<article class="wrap narrow doc">
  <header class="doc__head reveal">
    <p class="eyebrow">Setup guide</p>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="doc__lead">{{ . }}</p>{{ end }}
  </header>
  {{ with .TableOfContents }}
  <nav class="toc reveal" aria-label="On this page">
    <p class="toc__title">On this page</p>
    {{ . }}
  </nav>
  {{ end }}
  <div class="prose reveal">
    {{ .Content }}
  </div>
</article>
{{ end }}
