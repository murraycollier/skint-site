<dialog class="waitlist" id="waitlist" aria-labelledby="waitlist-title">
  <button class="waitlist__close" type="button" aria-label="Close">✕</button>
  <div class="waitlist__body" id="waitlist-form-view">
    <p class="eyebrow">Skint</p>
    <h2 id="waitlist-title">Join the waitlist</h2>
    <p class="muted">Skint isn't on sale yet. Leave your email and we'll let you know when you can buy it, at {{ site.Params.price }}.</p>
    <form id="waitlist-form" action="{{ site.Params.waitlistUrl }}" method="POST" novalidate>
      <label class="field">
        <span>Email</span>
        <input type="email" name="email" required autocomplete="email" placeholder="you@example.com">
      </label>
      <label class="field">
        <span>Anything you'd like us to know? <em class="muted">(optional)</em></span>
        <textarea name="message" rows="3" maxlength="1000"></textarea>
      </label>
      <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="btn btn--block" type="submit">Join the waitlist</button>
      <p class="status" id="waitlist-status" role="status" aria-live="polite"></p>
    </form>
  </div>
</dialog>
