{{ define "main" }}
<header class="guide-hero">
  <div class="wrap">
    <p class="eyebrow">Documentation</p>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="lead">{{ . }}</p>{{ end }}
  </div>
</header>

<div class="wrap docs-index">
  <div class="docs-cards">
    {{ range .Pages }}
    <a class="docs-card" href="{{ .RelPermalink }}">
      <span class="docs-card__label">Guide</span>
      <h2>{{ .Title }}</h2>
      <p>{{ .Description }}</p>
      <span class="docs-card__more">Read →</span>
    </a>
    {{ end }}
  </div>
  <p class="muted center">New to Skint? Start with the <a href="{{ "get-started/" | relLangURL }}">setup guide</a>.</p>
</div>
{{ end }}
